<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Mecanum Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Mecanum Bot</h1>
  <div id="connectionState">Verbindung wird hergestellt...</div>
</header>
<main>
  <section class="card">
    <div class="top-controls">
      <button id="armButton" class="arm-off">FAHRZEUG AKTIVIEREN</button>
      <a class="maintenance-link" href="/maintenance">Maintenance</a>
    </div>
    <div class="joystick-row">
      <div class="joystick-column">
        <h3>Fahren / Drehen</h3>
        <div id="stick1" class="joystick"><div id="knob1" class="knob"></div></div>
        <div id="stick1Info" class="stick-info">Richtung 0 / 0 %</div>
      </div>
      <div class="joystick-column">
        <h3>Seite / Diagonal</h3>
        <div id="stick2" class="joystick"><div id="knob2" class="knob"></div></div>
        <div id="stick2Info" class="stick-info">Richtung 0 / 0 %</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Motor Einstellungen</h2>
    <div class="settings-grid">
      <label>Speed Mode
        <select id="speedMode">
          <option value="0">100 %</option>
          <option value="1">80 %</option>
          <option value="2">60 %</option>
        </select>
      </label>
      <label>Start Minimum %
        <input id="startMin" type="number" min="0" max="100">
      </label>
      <label>Boost %
        <input id="boost" type="number" min="0" max="100">
      </label>
      <label>Boost Time 0-100
        <input id="boostTime" type="number" min="0" max="100">
      </label>
      <label>Deadzone %
        <input id="deadzone" type="number" min="0" max="30">
      </label>
    </div>

    <h3>Invertierungen</h3>
    <div class="checkbox-grid">
      <label><input id="invertFL" type="checkbox"> Front Left</label>
      <label><input id="invertFR" type="checkbox"> Front Right</label>
      <label><input id="invertRL" type="checkbox"> Rear Left</label>
      <label><input id="invertRR" type="checkbox"> Rear Right</label>
      <label><input id="invertMoveY" type="checkbox"> Move Y</label>
      <label><input id="invertMoveX" type="checkbox"> Move X</label>
      <label><input id="invertTurn" type="checkbox"> Turn</label>
    </div>

    <button id="saveSettingsButton">Einstellungen speichern</button>
    <div id="settingsStatus" class="status"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
